name: Notify FCM on New News
on:
  push:
    paths:
      - 'news/*.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get latest news file
        id: news
        run: |
          set +e
          DIFF_OUTPUT=$(git diff --name-status HEAD~1 HEAD -- 'news/*.json')
          set -e

          if [ -z "$DIFF_OUTPUT" ]; then
            echo "لا يوجد تغيير في ملفات الأخبار"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          STATUS=$(echo "$DIFF_OUTPUT" | head -n 1 | awk '{print $1}')
          NEW_FILE=$(echo "$DIFF_OUTPUT" | head -n 1 | awk '{print $2}')

          if [ -z "$NEW_FILE" ]; then
            echo "لم يتم العثور على ملف"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$STATUS" = "A" ]; then
            echo "نوع العملية: خبر جديد"
            echo "action=جديد" >> $GITHUB_OUTPUT
            echo "notif_title=خبر جديد" >> $GITHUB_OUTPUT
          elif [ "$STATUS" = "M" ]; then
            echo "نوع العملية: تعديل خبر"
            echo "action=تعديل" >> $GITHUB_OUTPUT
            echo "notif_title=تم تعديل خبر" >> $GITHUB_OUTPUT
          else
            echo "نوع العملية غير مدعوم: $STATUS"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

          if [ ! -f "$NEW_FILE" ]; then
            echo "⚠️ الملف غير موجود: $NEW_FILE"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          TITLE=$(jq -r '.title // "بدون عنوان"' "$NEW_FILE")
          REGION=$(jq -r '.region // ""' "$NEW_FILE")
          NEWS_ID=$(jq -r '.id // ""' "$NEW_FILE")
          IMAGE_URL=$(jq -r '.images[0] // ""' "$NEW_FILE")

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "newsId=$NEWS_ID" >> $GITHUB_OUTPUT
          echo "imageUrl=$IMAGE_URL" >> $GITHUB_OUTPUT

          echo "✅ العنوان: $TITLE"
          echo "✅ المنطقة: $REGION"
          echo "✅ المعرف: $NEWS_ID"
          echo "✅ الصورة: $IMAGE_URL"

      - name: Debug values
        if: steps.news.outputs.skip == 'false'
        run: |
          echo "File: ${{ steps.news.outputs.file }}"
          echo "Title: ${{ steps.news.outputs.title }}"
          echo "Region: ${{ steps.news.outputs.region }}"
          echo "NewsId: ${{ steps.news.outputs.newsId }}"
          echo "ImageUrl: ${{ steps.news.outputs.imageUrl }}"
          echo "Action: ${{ steps.news.outputs.action }}"
          echo "Secret length: ${#FCM_SERVICE_ACCOUNT}"
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "❌ FCM_SERVICE_ACCOUNT فارغ أو غير موجود"
            exit 1
          fi
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        if: steps.news.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install firebase-admin
        if: steps.news.outputs.skip == 'false'
        run: npm install firebase-admin

      - name: Send FCM notification
        if: steps.news.outputs.skip == 'false'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          NEWS_TITLE: ${{ steps.news.outputs.title }}
          NEWS_REGION: ${{ steps.news.outputs.region }}
          NEWS_ID: ${{ steps.news.outputs.newsId }}
          NEWS_ACTION: ${{ steps.news.outputs.action }}
          NOTIF_TITLE: ${{ steps.news.outputs.notif_title }}
          NEWS_IMAGE: ${{ steps.news.outputs.imageUrl }}
        run: node send-notification.js
